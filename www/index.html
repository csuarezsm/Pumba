<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="author" content="IT Canarias">
<meta name="copyright" content="© 2026 IT Canarias. Todos los derechos reservados.">
<meta name="theme-color" content="#16304f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pumba">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Pumba</title>
<style>
:root{
  --bg:#10233d; --felt:#16304f; --card:#1d3d63; --card2:#264d78; --line:#335f8f;
  --txt:#f2f5fa; --mut:#a5b6cc; --gold:#ff9f1c; --red:#ff5d5d; --blue:#5ad1e6; --ok:#5fd39a;
  --r:14px; --on-gold:#2a1500; --on-blue:#062a33; --outbg:#262a33;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--txt);font:calc(16px * var(--fs, 1))/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:var(--felt);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
header h1{font-size:calc(19px * var(--fs, 1));margin:0;flex:1;letter-spacing:.3px}
header h1 small{display:block;font-size:calc(12px * var(--fs, 1));color:var(--mut);font-weight:500}
main{padding:14px;max-width:720px;margin:0 auto}
button{font:inherit;color:inherit;border:0;border-radius:12px;padding:12px 16px;background:var(--card2);cursor:pointer}
button:active{transform:scale(.97)}
button[disabled]{opacity:.4}
.btn-gold{background:var(--gold);color:var(--on-gold);font-weight:700}
.btn-red{background:var(--red);color:#fff;font-weight:600}
.btn-ghost{background:transparent;border:1px solid var(--line)}
.icon{position:relative;width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:calc(20px * var(--fs, 1));background:transparent}
.sec{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:14px}
.sec h2{font-size:calc(15px * var(--fs, 1));margin:0 0 10px;color:var(--gold);text-transform:uppercase;letter-spacing:.6px}
label.f{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
label.f:first-of-type{border-top:0}
label.f span{flex:1;min-width:0}
label.f select{max-width:58%}
input.tg{appearance:none;-webkit-appearance:none;width:52px;height:30px;border-radius:999px;background:var(--bg);border:1px solid var(--line);position:relative;flex:none;padding:0;cursor:pointer;transition:background .15s}
input.tg::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mut);transition:transform .15s,background .15s}
input.tg:checked{background:var(--gold);border-color:var(--gold)}
input.tg:checked::after{transform:translateX(22px);background:var(--on-gold)}
label.f em{display:block;font-style:normal;font-size:calc(12px * var(--fs, 1));color:var(--mut)}
input,select{font:inherit;color:var(--txt);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
input[type=number]{width:90px;text-align:center}
input:focus,select:focus{outline:2px solid var(--gold);outline-offset:0}
.plist .pr{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.plist .pr input{flex:1;min-width:0}
.plist .pr button{padding:10px 12px}
.dealpick{display:inline-block;width:calc(38px * var(--fs, 1));height:calc(38px * var(--fs, 1));border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:calc(12px * var(--fs, 1));color:var(--mut);flex:none}
.dealpick.on{background:var(--gold);border-color:var(--gold);color:var(--on-gold);font-weight:800}
.row{display:flex;gap:10px}
.row>*{flex:1}
.mut{color:var(--mut);font-size:calc(13px * var(--fs, 1))}

/* Marcador */
.status{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.chip{background:var(--card);border-radius:999px;padding:8px 14px;font-size:calc(14px * var(--fs, 1))}
.chip b{color:var(--gold)}
.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.pc{background:var(--card);border-radius:var(--r);padding:12px;position:relative;border:2px solid transparent}
.pc.dealer{border-color:var(--gold)}
.pc.out{opacity:.55;background:var(--outbg)}
.pc .nm{font-weight:700;font-size:calc(16px * var(--fs, 1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:26px}
.pc .tt{font-size:calc(40px * var(--fs, 1));font-weight:800;line-height:1.05;margin:4px 0;font-variant-numeric:tabular-nums}
.pc .bar{height:6px;background:var(--bg);border-radius:4px;overflow:hidden}
.pc .bar i{display:block;height:100%;background:var(--ok)}
.pc .bar i.warn{background:var(--gold)}.pc .bar i.danger{background:var(--red)}
.pc .ft{font-size:calc(12px * var(--fs, 1));color:var(--mut);margin-top:6px;display:flex;justify-content:space-between;gap:6px}
.pc .badge{position:absolute;top:10px;right:10px;width:calc(24px * var(--fs, 1));height:calc(24px * var(--fs, 1));border-radius:50%;background:var(--gold);color:var(--on-gold);font-size:calc(11px * var(--fs, 1));font-weight:800;display:grid;place-items:center}
.pc .rb{margin-top:8px;width:100%;padding:8px;font-size:calc(14px * var(--fs, 1));background:var(--blue);color:var(--on-blue);font-weight:700}
.pc.lead .nm::after{content:" ▶";color:var(--blue);font-size:calc(12px * var(--fs, 1))}
.fab{position:fixed;left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:692px;margin:0 auto;
  padding:16px;font-size:calc(18px * var(--fs, 1));box-shadow:0 6px 20px rgba(0,0,0,.4);z-index:6}
.winner{background:var(--gold);color:var(--on-gold);border-radius:var(--r);padding:18px;text-align:center;margin-bottom:14px}
.winner .big{font-size:calc(28px * var(--fs, 1));font-weight:900}
.winner .actions{display:flex;gap:8px;margin-top:12px}
.winner .actions button{flex:1;background:var(--on-gold);color:var(--gold);font-weight:700}

/* Historial */
.tbl-wrap{overflow-x:auto;border-radius:var(--r);background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:calc(14px * var(--fs, 1))}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--card2);font-size:calc(13px * var(--fs, 1));max-width:90px;overflow:hidden;text-overflow:ellipsis}
td:first-child,th:first-child{text-align:left;padding-left:10px;color:var(--mut);position:sticky;left:0;background:var(--card)}
th:first-child{background:var(--card2)}
td .pt{display:block;font-size:calc(12px * var(--fs, 1));color:var(--mut)}
td .to{font-weight:700}
td.out{color:var(--mut);opacity:.6}
td.cl .pt{color:var(--gold);font-weight:700}
tr.rebuy td{background:rgba(90,169,230,.12);font-size:calc(13px * var(--fs, 1))}
tr.hand{cursor:pointer}
tr.hand:active td{background:var(--card2)}
.dl{color:var(--gold);font-size:calc(11px * var(--fs, 1))}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal.hidden{display:none}
.sheet{background:var(--felt);width:100%;max-width:720px;max-height:92vh;overflow-y:auto;overflow-x:hidden;border-radius:20px 20px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:calc(20px * var(--fs, 1))}
.sheet .sub{color:var(--mut);font-size:calc(13px * var(--fs, 1));margin-bottom:12px}
.hrow{background:var(--card);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.hrow .top{display:flex;align-items:center;gap:10px}
.hrow .top .n{flex:1;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .top .n small{display:block;font-weight:400;color:var(--mut);font-size:calc(12px * var(--fs, 1))}
.scbox{width:calc(84px * var(--fs, 1));min-height:48px;padding:8px;font-size:calc(22px * var(--fs, 1));font-weight:800;background:var(--bg);border:2px solid var(--line);border-radius:10px;flex:none}
.scbox.on{border-color:var(--gold);color:var(--gold)}
.scbox.fixed{opacity:.6}
.hrow.act{outline:2px solid var(--gold);outline-offset:-2px}
.kfoot{position:sticky;bottom:calc(-16px - env(safe-area-inset-bottom));background:var(--felt);margin:6px -16px calc(-16px - env(safe-area-inset-bottom));padding:8px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keypad button{padding:0;height:clamp(38px, 6.2vh, 54px);font-size:calc(22px * var(--fs, 1));font-weight:700;background:var(--card2);border-radius:10px}
.keypad .knext{background:var(--gold);color:var(--on-gold);font-size:calc(17px * var(--fs, 1));white-space:nowrap}
.kfoot .acts{margin-top:6px!important;gap:8px}
.kfoot .acts button{padding:10px}
.kfoot .err{min-height:0;margin:0 0 4px}
.hand .hrow{padding:6px 10px;margin-bottom:6px}
.hand .scbox{min-height:42px;padding:4px}
.hand .closebtn{padding:6px 8px}
.hand label.f{padding:2px 0}
#undoBar{position:fixed;left:14px;right:14px;bottom:calc(92px + env(safe-area-inset-bottom));max-width:692px;margin:0 auto;background:#000e;color:#fff;border-radius:14px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;z-index:15;opacity:0;transform:translateY(16px);pointer-events:none;transition:opacity .25s,transform .25s;font-size:calc(15px * var(--fs, 1))}
#undoBar.on{opacity:1;transform:none;pointer-events:auto}
#undoBar span{flex:1}
#undoBar button{background:var(--gold);color:var(--on-gold);font-weight:800;padding:10px 14px;white-space:nowrap}
.closebtn{padding:8px 10px;font-size:calc(13px * var(--fs, 1));background:transparent;border:1px solid var(--line);white-space:nowrap}
.closebtn.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
.kinds{display:flex;gap:6px;margin-top:8px}
.kinds button{flex:1;min-width:0;overflow-wrap:anywhere;padding-left:4px;padding-right:4px;padding:8px 6px;font-size:calc(13px * var(--fs, 1));background:var(--bg);border:1px solid var(--line)}
.kinds button.on{background:var(--gold);color:var(--on-gold);font-weight:700;border-color:var(--gold)}
.sheet .acts{display:flex;gap:10px;margin-top:14px}
.sheet .acts button{flex:1;padding:14px}
.err{color:var(--red);font-size:calc(14px * var(--fs, 1));margin-top:8px;min-height:1em}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:999px;font-size:calc(14px * var(--fs, 1));opacity:0;transition:opacity .25s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
.menu button{display:block;width:100%;text-align:left;margin-bottom:8px;background:var(--card)}
.menu .mt{font-size:calc(12px * var(--fs, 1));font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);margin:14px 4px 6px}.menu .mt:first-child{margin-top:4px}
.menu .mg2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.menu .mg2 button{margin:0}
.menu button.btn-gold{background:var(--gold);color:var(--on-gold)}
.menu button.btn-red{background:var(--red);color:#fff}
.donate{background:var(--card);border:1px solid var(--gold);border-radius:14px;padding:14px;margin-top:4px;text-align:center}
.donate .dt{font-weight:800;font-size:calc(17px * var(--fs, 1));color:var(--gold)}
.donate .dd{color:var(--mut);font-size:calc(14px * var(--fs, 1));margin:6px 0 12px}
.donate button{width:100%;padding:14px;font-size:calc(16px * var(--fs, 1))}
.copy{text-align:center;color:var(--mut);font-size:calc(12px * var(--fs, 1));padding:8px 0 4px;opacity:.8}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:6px 0 4px}
.th{padding:0;border-radius:14px;overflow:hidden;border:3px solid transparent;text-align:left;background:none}
.th.on{border-color:var(--gold)}
.th .pv{height:74px;padding:10px;display:flex;gap:6px;align-items:flex-end}
.th .pv i{flex:1;height:38px;border-radius:8px;display:block}
.th .pv b{width:26px;height:26px;border-radius:50%;display:block;flex:none}
.th .tn{padding:8px 10px;font-weight:700;font-size:calc(14px * var(--fs, 1));display:flex;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 12px}
.chipb{padding:8px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:calc(15px * var(--fs, 1))}
.chipb.on{background:var(--gold);color:var(--on-gold);border-color:var(--gold);font-weight:700}
#menuBtn.dot::after{content:'';position:absolute;top:6px;right:6px;width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--felt)}
#updBanner{display:none;background:var(--gold);color:var(--on-gold);font-weight:700;text-align:center;padding:10px 14px;cursor:pointer;font-size:calc(15px * var(--fs, 1))}
#updBanner.on{display:block}
.pf-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.pf-av{width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--on-gold);display:grid;place-items:center;font-weight:800;flex:none}
.pf-rating{font-size:calc(30px * var(--fs, 1));font-weight:800;color:var(--gold);line-height:1}
.pf-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.pf-kpi{background:var(--card);border-radius:12px;padding:10px 12px}
.pf-kpi span{display:block;font-size:calc(12px * var(--fs, 1));color:var(--mut)}
.pf-kpi b{font-size:calc(22px * var(--fs, 1))}
.pf-kpi small,.pf-line small,.pf-t small{font-weight:400;color:var(--mut);font-size:calc(13px * var(--fs, 1))}
.pf-t{font-weight:700;color:var(--gold);margin:6px 0 6px;font-size:calc(14px * var(--fs, 1))}
.pf-box{background:var(--card);border-radius:12px;padding:6px 12px;margin-bottom:10px}
.pf-line{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.pf-line:first-child{border-top:0}
.pf-h2h{display:flex;align-items:center;gap:10px;padding:6px 0}
.pf-h2h span{width:30%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-h2h b{width:52px;text-align:right}
.pf-bar{flex:1;height:10px;border-radius:5px;background:var(--red);overflow:hidden;opacity:.9}
.pf-bar i{display:block;height:100%;background:var(--ok)}
.pf-months{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.pf-months div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;height:100%}
.pf-months i{display:block;width:100%;background:var(--card2);border-radius:5px 5px 0 0}
.pf-months small,.pf-months span{font-size:calc(11px * var(--fs, 1));color:var(--mut)}
.pt-opps{display:flex;gap:8px;margin-bottom:12px}
.pt-opp{flex:1;min-width:0;background:var(--card);border-radius:12px;padding:8px 10px;border:2px solid transparent}
.pt-opp.turn{border-color:var(--gold)}
.pt-on{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt-ot{font-size:calc(13px * var(--fs, 1));color:var(--mut)}
.pt-ob{display:flex;margin-top:4px;height:18px}
.pt-ob i{width:12px;height:18px;border-radius:3px;background:var(--card2);border:1px solid var(--line);margin-right:-4px}
.pt-mid{display:flex;justify-content:center;gap:28px;margin:6px 0 8px}
.pt-pile{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--mut);font-size:calc(12px * var(--fs, 1))}
.pt-btn{padding:0;background:none;border-radius:10px}
.pt-btn[disabled]{opacity:1}
.pt-btn:not([disabled]) .pc-card{box-shadow:0 0 0 3px var(--gold)}
.pt-pile .pc-card{width:64px;font-size:22px}
.pt-log{text-align:center;color:var(--mut);font-size:calc(14px * var(--fs, 1));min-height:1.3em}
.pt-hint{text-align:center;font-size:calc(15px * var(--fs, 1));margin:6px 0 10px;min-height:1.3em}
.pt-hand{display:flex;justify-content:center;gap:4px;flex-wrap:nowrap}
.pt-hand:not(.mini) .pc-card{flex:1 1 0;min-width:0;width:auto;max-width:58px}
.pt-hand:not(.mini) .pc-s{width:70%}
.pt-hand.big{flex-wrap:wrap;row-gap:10px}
.pt-hand.big .pc-card{flex:none;width:calc(58px * var(--cs));max-width:none;font-size:calc(17px * var(--cs) * var(--fs, 1))}
.pt-pile .pc-card{width:calc(64px * var(--cs, 1));font-size:calc(22px * var(--cs, 1))}
@media (orientation: landscape) and (max-height: 600px) {
  header{padding-top:calc(4px + env(safe-area-inset-top));padding-bottom:4px}
  body:has(.pt-table) header h1 small{display:none}
  main:has(.pt-table){max-width:none;padding:8px 14px}
  .pt-table{display:grid;grid-template-columns:minmax(0, 30%) minmax(0, 1fr);gap:14px;align-items:start}
  .pt-opps{flex-direction:column;gap:6px;margin-bottom:8px}
  .pt-opp{padding:5px 10px;display:flex;align-items:center;gap:8px}
  .pt-opp .pt-ob{display:none}
  .pt-on{flex:1}
  .pt-mid{margin:4px 0}
  .pt-pile .pc-card{width:calc(52px * var(--cs, 1))}
  .pt-hint{margin:2px 0 8px}
  .pt-hand .pc-card,.pt-hand.big .pc-card{flex:1 1 0;width:auto;min-width:0;max-width:calc(74px * var(--cs, 1))}
  .pt-hand.big{flex-wrap:nowrap}
  .pt-info{margin:8px 0}
  .pt-acts button{padding:10px 6px}
}
/* Tablets: la mesa se amplía para aprovechar la pantalla */
body:has(.pt-table){padding-bottom:env(safe-area-inset-bottom)}
@media (min-width: 560px) and (min-height: 880px) {
  main:has(.pt-table){max-width:none}
  .pt-table{zoom:1.15;max-width:500px;margin:0 auto}
}
@media (min-width: 700px) and (min-height: 700px) {
  main:has(.pt-table){max-width:none}
  .pt-table{zoom:1.4;max-width:520px;margin:0 auto}
}
@media (min-width: 980px) and (min-height: 940px) {
  .pt-table{zoom:1.7}
}
.pt-hand.mini{justify-content:flex-start;margin-top:6px}
.pt-info{text-align:center;color:var(--mut);font-size:calc(13px * min(var(--fs, 1), 1.1));margin:10px 0}
.pt-acts{display:flex;gap:8px}
.pt-acts button{flex:1;padding:14px 6px}
.pc-card{position:relative;width:min(13vw, 58px);aspect-ratio:5/8;padding:0;border-radius:8px;background:#fbf7ec;border:2px solid #d8d0bc;color:#1d1d1d;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3px 0 6px;transition:transform .12s;flex:none;font-size:calc(17px * var(--fs, 1))}
.pc-card.small{width:min(9vw, 38px);font-size:13px;border-width:1px;padding:2px 0 4px}
.pc-card.sel{transform:translateY(-12px);border-color:var(--gold);box-shadow:0 6px 14px rgba(0,0,0,.35)}
.pc-card.back{background:repeating-linear-gradient(45deg,#8e2b22 0 6px,#a8362c 6px 12px);border-color:#f3efe2;justify-content:center}
.pc-card.back span{background:#f3efe2;color:#8e2b22;border-radius:6px;padding:1px 5px;font-weight:800;font-size:13px}
.pc-card.empty{background:transparent;border:2px dashed var(--line)}
.pc-r{font-weight:800;line-height:1}
.pc-j{color:#7d3c98}.pc-card.joker{background:#f6effa}
.pc-o{color:#a87400}.pc-c{color:#b03024}.pc-e{color:#22508f}.pc-b{color:#2e7d32}
.pc-s{width:62%;display:block}.pc-s svg{width:100%;height:auto;display:block}
.pc-new{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--gold);border:2px solid var(--bg);font-size:0;color:transparent;overflow:hidden;padding:0;z-index:1}
.pc-card.fresh{box-shadow:0 0 0 2px var(--gold)}
.pc-card.tip{border-color:var(--gold);border-style:dashed;box-shadow:0 0 0 3px rgba(232,184,74,.35)}
.pt-btn.tip .pc-card{animation:tipPulse 1.2s ease-in-out infinite}
@keyframes tipPulse{50%{box-shadow:0 0 0 7px rgba(232,184,74,.45)}}
.pt-early{color:var(--gold)}
.pt-learn{background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--mut);margin-left:4px}
.pc-m{position:absolute;left:6px;right:6px;bottom:2px;height:4px;border-radius:2px;background:var(--mc)}
.empty{text-align:center;color:var(--mut);padding:20px}
/* Jugar en línea */
.on-code{font-size:calc(46px * var(--fs, 1));font-weight:800;letter-spacing:10px;color:var(--gold);margin:4px 0 12px;font-variant-numeric:tabular-nums}
.on-seat{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.on-seat:first-of-type{border-top:0}
.on-seat .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.on-seat .n small{color:var(--mut);font-weight:400}
.on-seat button{padding:4px 12px}
.on-dot{width:10px;height:10px;border-radius:50%;background:var(--red);flex:none}
.on-dot.ok{background:var(--ok)}
.on-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:calc(12px * var(--fs, 1));color:var(--mut);margin:-4px 0 8px}
.on-acts{display:flex;gap:10px;margin-top:12px;align-items:center}
.on-acts button{flex:1;padding:14px}
/* Mesa del Pumba */
.pc-card.ok{border-color:var(--ok)}
.pc-card.dim{filter:brightness(.72) saturate(.7)}
.pc-fx{position:absolute;left:3px;bottom:2px;font-style:normal;font-size:calc(10px * var(--cs, 1));font-weight:800;color:#555}
.pt-top{position:relative}
.pt-pen{position:absolute;top:-8px;right:-12px;background:var(--red);color:#fff;font-weight:900;border-radius:999px;padding:2px 8px;font-size:calc(15px * var(--fs, 1));box-shadow:0 2px 8px rgba(0,0,0,.4)}
.pt-state{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:2px 0 6px}
.pt-suit{display:inline-flex;align-items:center;gap:6px;background:var(--card);border-radius:999px;padding:4px 12px 4px 6px;font-size:calc(14px * var(--fs, 1))}
.pt-suit svg{width:22px;height:22px;background:#fbf7ec;border-radius:50%;padding:2px}
.pt-dir{color:var(--mut);font-size:calc(13px * var(--fs, 1))}
.pt-pb{background:var(--red);color:#fff;border-radius:999px;padding:0 6px;font-size:calc(11px * var(--fs, 1));font-weight:800}
.pt-btn.go .pc-card{box-shadow:0 0 0 3px var(--gold);animation:tipPulse 1.2s ease-in-out infinite}
@media not ((orientation: landscape) and (max-height: 600px)) {
  .pt-opps{flex-wrap:wrap}
  .pt-opp{flex:1 1 calc(33.33% - 8px)}
}
/* Muchas cartas en la mano (castigos acumulados): dos filas en vez de cartas diminutas */
.pt-hand.many{flex-wrap:wrap;row-gap:10px}
.pt-hand.many .pc-card,.pt-hand.many.big .pc-card{flex:0 0 calc((100% - 24px) / 7);width:auto;max-width:calc(58px * var(--cs, 1))}
.pt-claim{width:100%;margin:0 0 8px;padding:12px;font-weight:800;animation:tipPulse 1.2s ease-in-out infinite}
.pt-say[disabled]{opacity:.35}
.pt-suits{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:8px 0}
.pt-suits button{display:flex;align-items:center;gap:10px;padding:14px;background:var(--card);font-weight:700;font-size:calc(17px * var(--fs, 1))}
.pt-suits svg{width:34px;height:34px;background:#fbf7ec;border-radius:8px;padding:3px;flex:none}
.rules h4{color:var(--gold);margin:14px 0 4px}
.rules p,.rules li{color:var(--txt);line-height:1.5;margin:4px 0}
.rules ul{padding-left:20px;margin:4px 0}
</style>
</head>
<body>
<header>
  <h1 id="title">Pumba<small id="subtitle">Marcador de puntos</small></h1>
  <button class="icon" id="menuBtn" aria-label="Menú">⋮</button>
</header>
<div id="updBanner" role="button"></div>
<main id="app"></main>
<div id="modal" class="modal hidden"></div>
<div id="toast"></div>
<div id="undoBar"></div>

<script src="marcador.js"></script>
<script src="juego.js"></script>
<script src="online.js"></script>
<script>window.APP_ID = 'pumba';</script>
<script src="i18n-en.js"></script>
<script src="i18n-fr.js"></script>
<script src="i18n-de.js"></script>
<script src="i18n-it.js"></script>
<script src="idioma.js"></script>
<script src="masjuegos.js"></script>
<script src="audio-suave.js"></script>
<script src="turno.js"></script>
<script src="sonidos-cartas.js"></script>
<script src="contador.js"></script>
<script src="invitacion.js"></script>
<script src="publicas.js"></script>
<script>
'use strict';
/* ================= Estado y persistencia ================= */
const KEY = 'pumba.v1';
const DONATE_URL = 'https://www.paypal.com/ncp/payment/KJCPZWMUM3JXG';
// En la app Android (Capacitor) la navegación a otra web se abre en el navegador del sistema
function openExternal(url) {
  if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) { location.href = url; return; }
  const w = window.open(url, '_blank', 'noopener');
  if (!w) location.href = url;
}
/* ================= Temas de color ================= */
const THEMES = {
  pumba:    { name: 'Pumba',     bg:'#10233d', felt:'#16304f', card:'#1d3d63', card2:'#264d78', line:'#335f8f', txt:'#f2f5fa', mut:'#a5b6cc', gold:'#ff9f1c', onGold:'#2a1500', red:'#ff5d5d', blue:'#5ad1e6', onBlue:'#062a33', ok:'#5fd39a', outbg:'#262a33' },
  tapete:   { name: 'Tapete',    bg:'#0b2a20', felt:'#0e3b2c', card:'#134a37', card2:'#1a5a43', line:'#2a6b52', txt:'#f3efe2', mut:'#a9c3b6', gold:'#e8b84a', onGold:'#2a1e00', red:'#e2574c', blue:'#5aa9e6', onBlue:'#06233a', ok:'#62c98a', outbg:'#2b2b2b' },
  burdeos:  { name: 'Burdeos',   bg:'#22090e', felt:'#3a141b', card:'#4a1a23', card2:'#5c222d', line:'#7a2f3c', txt:'#f7ece4', mut:'#d0aeb0', gold:'#f0c060', onGold:'#2a1e00', red:'#ff7a6b', blue:'#7cc0f0', onBlue:'#06233a', ok:'#7ad69c', outbg:'#2e2a2b' },
  morado:   { name: 'Morado',    bg:'#160d22', felt:'#24163a', card:'#2f1d4b', card2:'#3b265e', line:'#4f3779', txt:'#f3eefa', mut:'#b6a8cc', gold:'#ffb547', onGold:'#2a1600', red:'#ff6b81', blue:'#7fb8ff', onBlue:'#06233a', ok:'#6fe0a4', outbg:'#2a2730' },
  grafito:  { name: 'Grafito',   bg:'#121212', felt:'#1c1c1e', card:'#26262a', card2:'#323238', line:'#46464c', txt:'#f2f2f2', mut:'#a8a8ad', gold:'#4fc3f7', onGold:'#00222f', red:'#ff6b6b', blue:'#9fa8ff', onBlue:'#0d1033', ok:'#69db7c', outbg:'#1a1a1a' },
  claro:    { name: 'Claro',     bg:'#f1eee6', felt:'#ffffff', card:'#ffffff', card2:'#e8e3d6', line:'#d6cfbd', txt:'#1d2a24', mut:'#66716b', gold:'#1f7a55', onGold:'#ffffff', red:'#c0392b', blue:'#2a73c2', onBlue:'#ffffff', ok:'#2e9e62', outbg:'#e2ded3' },
  contraste:{ name: 'Alto contraste', bg:'#000000', felt:'#000000', card:'#111111', card2:'#222222', line:'#777777', txt:'#ffffff', mut:'#dddddd', gold:'#ffdd00', onGold:'#000000', red:'#ff4d4d', blue:'#00c8ff', onBlue:'#000000', ok:'#00e676', outbg:'#1a1a1a' }
};
function applyTheme(key) {
  const t = THEMES[key] || THEMES.pumba, r = document.documentElement.style;
  const map = { bg:'--bg', felt:'--felt', card:'--card', card2:'--card2', line:'--line', txt:'--txt', mut:'--mut', gold:'--gold', onGold:'--on-gold', red:'--red', blue:'--blue', onBlue:'--on-blue', ok:'--ok', outbg:'--outbg' };
  for (const k in map) r.setProperty(map[k], t[k]);
  document.documentElement.style.colorScheme = key === 'claro' ? 'light' : 'dark';
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t.felt);
  // En la app Android, el fondo de las barras del sistema sigue al tema
  try { const U = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.AppUpdater; if (U && U.setSystemBars) U.setSystemBars({ color: t.felt, light: key === 'claro' }).catch(() => {}); } catch (e) {}
}
const FONT_SIZES = [['1', 'Normal'], ['1.15', 'Grande'], ['1.3', 'Muy grande']];
function applyFont() {
  const z = parseFloat(S.fontScale) || 1;
  document.documentElement.style.setProperty('--fs', z);
}
function openThemes() {
  const cur = S.theme || 'pumba';
  openModal(`<h3>🔠 Tamaño de letra</h3>
    <div class="kinds" style="margin:6px 0 16px">${FONT_SIZES.map(([v, l]) => `<button data-fs="${v}" class="${String(S.fontScale || '1') === v ? 'on' : ''}" style="font-size:${13 * parseFloat(v)}px">${l}</button>`).join('')}</div>
    <h3>🃏 Tamaño de las cartas</h3>
    <div class="kinds" style="margin:6px 0 16px">${CARD_SIZES.map(([v, l]) => `<button data-cs="${v}" class="${String(S.cardScale || '1') === v ? 'on' : ''}">${l.charAt(0).toUpperCase() + l.slice(1)}</button>`).join('')}</div>
    <h3>🎨 Colores</h3><div class="sub">Toca un tema y se aplica al momento.</div>
    <div class="themes">${Object.entries(THEMES).map(([k, t]) => `
      <button class="th ${k === cur ? 'on' : ''}" data-theme="${k}" style="background:${t.card}">
        <div class="pv" style="background:${t.bg}"><i style="background:${t.card}"></i><i style="background:${t.card2}"></i><b style="background:${t.gold}"></b></div>
        <div class="tn" style="color:${t.txt}">${esc(t.name)}<span style="color:${t.gold}">${k === cur ? '✓' : ''}</span></div>
      </button>`).join('')}</div>
    <h3>🎵 Juego</h3>
    <label class="f"><span>Sonidos<em>Repartir, robar, echar carta y fin de mano</em></span><input type="checkbox" class="tg" id="thSound" ${S.sound !== false ? 'checked' : ''}></label>
    <label class="f" style="margin-bottom:10px"><span>Velocidad de la máquina<em>Cuánto tarda en jugar cada carta</em></span><span class="kinds" style="flex:none;width:50%;margin:0">${[['normal', 'Normal'], ['rapida', 'Rápida']].map(([v, l]) => `<button data-speed="${v}" class="${(S.speed || 'normal') === v ? 'on' : ''}">${l}</button>`).join('')}</span></label>
    <h3>🔔 Avisos</h3>${AvisoTurno.opcionHtml()}
    <div class="acts"><button class="btn-gold" id="thOk">Listo</button></div>`);
  $('#thSound').onchange = e => { S.sound = e.target.checked; save(); if (S.sound) SonidoCartas.play('carta'); };
  document.querySelectorAll('[data-speed]').forEach(b => b.onclick = () => { S.speed = b.dataset.speed; save(); openThemes(); });
  document.querySelectorAll('[data-theme]').forEach(b => b.onclick = () => { S.theme = b.dataset.theme; applyTheme(S.theme); save(); openThemes(); });
  document.querySelectorAll('[data-cs]').forEach(b => b.onclick = () => { S.cardScale = b.dataset.cs; save(); openThemes(); });
  document.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => { S.fontScale = b.dataset.fs; applyFont(); save(); openThemes(); });
  $('#thOk').onclick = closeModal;
  AvisoTurno.enlazar();
}

const APP_VERSION = '1.4.5';
const REPO = 'csuarezsm/Pumba';
const MAX_ARCHIVE = 500;
const MAX_PLAYERS = 6;          // de 2 a 6 jugadores
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch (e) { return null; } }
let saveWarned = false;
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); saveWarned = false; }
  catch (e) { if (!saveWarned) { saveWarned = true; setTimeout(() => toast('⚠️ No se pudo guardar. Exporta una copia y borra partidas antiguas.'), 0); } }
}

let S = load() || {};
S.game = S.game || null;
S.draft = S.draft || {
  names: ['', '', ''],
  dealer: 0,
  cfg: Object.assign({}, DEF_CFG, S.lastCfg || {})
};
S.archive = S.archive || [];
if (!Array.isArray(S.roster)) {
  S.roster = [];
  const seen = new Set();
  const addSeed = n => { n = String(n || '').trim(); const k = n.toLowerCase(); if (n && !/^jugador \d+$/i.test(n) && !/^🤖/.test(n) && !seen.has(k)) { seen.add(k); S.roster.push(n); } };
  (S.lastNames || []).forEach(addSeed);
  S.archive.forEach(a => (a.players || []).forEach(p => addSeed(p.name)));
  if (S.game) S.game.players.forEach(p => addSeed(p.name));
}

/* ================= Utilidades UI ================= */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2000); }
function vibrate(ms) { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} }
function openModal(html) { const m = $('#modal'); m.innerHTML = '<div class="sheet">' + html + '</div>'; m.classList.remove('hidden'); }
function closeModal() { const m = $('#modal'); m.classList.add('hidden'); m.innerHTML = ''; }
$('#updBanner').onclick = () => openUpdAvail();
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
function confirmBox(title, text, okLabel, onOk, danger) {
  openModal(`<h3>${esc(title)}</h3><div class="sub">${esc(text)}</div>
    <div class="acts"><button class="btn-ghost" id="cNo">Cancelar</button><button class="${danger ? 'btn-red' : 'btn-gold'}" id="cOk">${esc(okLabel)}</button></div>`);
  $('#cNo').onclick = closeModal;
  $('#cOk').onclick = () => { closeModal(); onOk(); };
}

/* Mantener la pantalla encendida durante la partida */
let wakeLock = null;
async function keepAwake() {
  try { if (S.game && 'wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => wakeLock = null); } } catch (e) {}
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });

/* ================= Render principal ================= */
function render() {
  save();
  if (S.game) renderGame(); else if (ON.sala) renderOnline(); else renderSetup();
}

/* ---------- Configuración de partida nueva ---------- */
function cfgFields(cfg, prefix) {
  return `
  <label class="f"><span>Eliminado al pasar de<em>Límite de puntos</em></span><input type="number" inputmode="numeric" id="${prefix}limit" value="${cfg.limit}"></label>
  <label class="f"><span>Reenganche<em>Opcional: con qué puntos vuelve quien pasa del límite</em></span>
    <select id="${prefix}rebuyMode">
      <option value="max" ${cfg.rebuyMode === 'max' ? 'selected' : ''}>Con el que más tiene de los que siguen</option>
      <option value="fixed" ${cfg.rebuyMode === 'fixed' ? 'selected' : ''}>Puntos fijos</option>
      <option value="none" ${cfg.rebuyMode === 'none' ? 'selected' : ''}>Sin reenganche</option>
    </select></label>
  <label class="f" id="${prefix}rbFixedRow" style="${cfg.rebuyMode === 'fixed' ? '' : 'display:none'}"><span>Vuelve con</span><input type="number" inputmode="numeric" id="${prefix}rebuyFixed" value="${cfg.rebuyFixed}"></label>
  <label class="f"><span>Reenganches por jugador<em>0 = sin límite</em></span><input type="number" inputmode="numeric" min="0" id="${prefix}maxRebuys" value="${cfg.maxRebuys}"></label>
  <label class="f"><span>Entrada (€)<em>Opcional, para llevar el bote</em></span><input type="number" inputmode="decimal" step="0.5" min="0" id="${prefix}stake" value="${cfg.stake}"></label>
  <label class="f"><span>Reenganche (€)</span><input type="number" inputmode="decimal" step="0.5" min="0" id="${prefix}rebuyStake" value="${cfg.rebuyStake}"></label>`;
}
function bindCfg(prefix) {
  const rb = $('#' + prefix + 'rebuyMode');
  rb.onchange = () => $('#' + prefix + 'rbFixedRow').style.display = rb.value === 'fixed' ? '' : 'none';
}
function readCfg(prefix) {
  const n = (id, d) => { const v = parseFloat($('#' + prefix + id).value); return isNaN(v) ? d : v; };
  return {
    limit: Math.round(n('limit', 100)),
    rebuyMode: $('#' + prefix + 'rebuyMode').value, rebuyFixed: Math.round(n('rebuyFixed', 0)),
    maxRebuys: Math.max(0, Math.round(n('maxRebuys', 1))), stake: Math.max(0, n('stake', 0)), rebuyStake: Math.max(0, n('rebuyStake', 0))
  };
}

function renderSetup() {
  if (S.draft.mode === 'play') return renderPlaySetup();
  if (S.draft.mode === 'online') return renderOnline();
  $('#subtitle').textContent = 'Nueva partida';
  const d = S.draft;
  const rows = d.names.map((n, i) => `
    <div class="pr">
      <button class="dealpick ${d.dealer === i ? 'on' : ''}" data-deal="${i}" title="Da primero">${d.dealer === i ? 'DA' : i + 1}</button>
      <input type="text" maxlength="18" placeholder="Jugador ${i + 1}" value="${esc(n)}" data-name="${i}" autocomplete="off" list="rosterList">
      <button data-up="${i}" ${i === 0 ? 'disabled' : ''} aria-label="Subir">↑</button>
      <button data-del="${i}" ${d.names.length <= 2 ? 'disabled' : ''} aria-label="Quitar">✕</button>
    </div>`).join('');
  $('#app').innerHTML = `
    ${modeToggleHtml()}
    <div class="sec plist">
      <h2>Jugadores</h2>
      ${S.roster.length ? `<div class="mut" style="margin-bottom:6px">Toca los habituales para añadirlos o quitarlos:</div>
      <div class="chips">${rosterSorted().map(n => `<button class="chipb ${d.names.some(x => nkey(x) === nkey(n)) ? 'on' : ''}" data-chip="${esc(n)}">${esc(n)}</button>`).join('')}
        <button class="chipb" id="manageRoster" style="border-style:dashed">👥 Gestionar</button></div>` : ''}
      <div class="mut" style="margin-bottom:10px">Ponlos en el orden en que estáis sentados. Toca el círculo para elegir quién da primero.</div>
      ${rows}
      <datalist id="rosterList">${S.roster.map(n => `<option value="${esc(n)}">`).join('')}</datalist>
      <button class="btn-ghost" id="addP" style="width:100%" ${d.names.length >= MAX_PLAYERS ? 'disabled' : ''}>+ Añadir jugador</button>
    </div>
    <div class="sec"><h2>Reglas</h2>${cfgFields(d.cfg, 's_')}</div>
    ${S.archive.length ? `<div class="sec"><h2>Partidas anteriores</h2>${archiveHtml(3)}${S.archive.length ? '<button class="btn-ghost" id="allArch" style="width:100%;margin-top:4px">Ver clasificación y todas</button>' : ''}</div>` : ''}
    <div class="copy">© 2026 IT Canarias. Todos los derechos reservados.</div>
    <button class="btn-gold fab" id="start">Empezar partida</button>`;
  bindCfg('s_');
  bindModeToggle();
  const syncNames = () => document.querySelectorAll('[data-name]').forEach(el => d.names[+el.dataset.name] = el.value);
  const syncCfg = () => { d.cfg = readCfg('s_'); };
  document.querySelectorAll('[data-name]').forEach(el => el.oninput = () => { d.names[+el.dataset.name] = el.value; save(); });
  document.querySelectorAll('.sec input, .sec select').forEach(el => { if (!el.dataset.name) el.addEventListener('change', () => { syncCfg(); save(); }); });
  document.querySelectorAll('[data-deal]').forEach(b => b.onclick = () => { syncNames(); syncCfg(); d.dealer = +b.dataset.deal; render(); });
  document.querySelectorAll('[data-up]').forEach(b => b.onclick = () => {
    syncNames(); syncCfg(); const i = +b.dataset.up; [d.names[i - 1], d.names[i]] = [d.names[i], d.names[i - 1]];
    if (d.dealer === i) d.dealer = i - 1; else if (d.dealer === i - 1) d.dealer = i; render();
  });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => {
    syncNames(); syncCfg(); const i = +b.dataset.del; d.names.splice(i, 1);
    if (d.dealer >= d.names.length || d.dealer === i) d.dealer = 0; else if (d.dealer > i) d.dealer--; render();
  });
  document.querySelectorAll('[data-chip]').forEach(b => b.onclick = () => {
    syncNames(); syncCfg();
    const n = b.dataset.chip, k = nkey(n), at = d.names.findIndex(x => nkey(x) === k);
    if (at >= 0) {
      if (d.names.length > 2) { d.names.splice(at, 1); if (d.dealer >= d.names.length || d.dealer === at) d.dealer = 0; else if (d.dealer > at) d.dealer--; }
      else d.names[at] = '';
    } else {
      const empty = d.names.findIndex(x => !x.trim());
      if (empty >= 0) d.names[empty] = n;
      else if (d.names.length < MAX_PLAYERS) d.names.push(n);
      else { toast('Máximo ' + MAX_PLAYERS + ' jugadores'); return; }
    }
    save(); render();
  });
  const mr = $('#manageRoster'); if (mr) mr.onclick = () => { syncNames(); syncCfg(); openRoster(); };
  $('#addP').onclick = () => { syncNames(); syncCfg(); d.names.push(''); render(); setTimeout(() => { const ins = document.querySelectorAll('[data-name]'); if (ins.length) ins[ins.length - 1].focus(); }, 50); };
  $('#start').onclick = () => {
    syncNames(); syncCfg();
    const names = d.names.map((n, i) => { const t = n.trim(); if (!t) return 'Jugador ' + (i + 1); const r = S.roster.find(x => nkey(x) === nkey(t)); return r || t; });
    const lower = names.map(n => n.toLowerCase());
    if (new Set(lower).size !== lower.length) { toast('Hay nombres repetidos'); return; }
    if (names.length < 2) { toast('Mínimo 2 jugadores'); return; }
    const players = names.map(n => ({ id: uid(), name: n }));
    S.game = { id: uid(), created: Date.now(), cfg: Object.assign({}, d.cfg), players, firstDealer: players[d.dealer].id, events: [] };

    names.forEach(n => { if (!/^Jugador \d+$/.test(n) && !S.roster.some(x => nkey(x) === nkey(n))) S.roster.push(n); });

/* ---------- Jugadores habituales ---------- */
function rosterSorted() {
  const c = {}; S.archive.forEach(a => a.players.forEach(p => { const k = nkey(p.name); c[k] = (c[k] || 0) + 1; }));
  return S.roster.slice().sort((a, b) => (c[nkey(b)] || 0) - (c[nkey(a)] || 0) || a.localeCompare(b, 'es'));
}
function renameEverywhere(oldName, newName) {
  const k = nkey(oldName);
  const fix = g => g && g.players.forEach(p => { if (nkey(p.name) === k) p.name = newName; });
  S.archive.forEach(a => { fix(a); if (nkey(a.winnerName) === k) a.winnerName = newName; });
  fix(S.game);
  if (S.draft) S.draft.names = S.draft.names.map(n => nkey(n) === k ? newName : n);
  if (S.lastNames) S.lastNames = S.lastNames.map(n => nkey(n) === k ? newName : n);
}
function openRoster() {

  const list = rosterSorted();
  openModal(`<h3>👥 Jugadores habituales</h3>
    <div class="sub">Corrige un nombre y se cambia también en el historial y el ranking. Si escribes el nombre de otro jugador de la lista, se <b>unen</b> (útil para «Tere» y «Teresa»).</div>
    ${list.map((n, i) => `<div class="hrow"><div class="top">
      <input type="text" maxlength="18" value="${esc(n)}" data-ro="${i}" data-orig="${esc(n)}" style="flex:1;min-width:0">
      <span class="mut" style="white-space:nowrap">${games[nkey(n)] || 0} part.</span>
      ${games[nkey(n)] ? `<button class="closebtn" data-pstat="${esc(n)}" aria-label="Ver ficha">📊</button>` : ''}
      <button class="closebtn" data-rodel="${esc(n)}" aria-label="Quitar">✕</button></div></div>`).join('') || '<div class="empty">Aún no hay jugadores guardados.</div>'}
    <div class="hrow"><div class="top"><input type="text" maxlength="18" id="roNew" placeholder="Nuevo jugador" style="flex:1;min-width:0"><button class="closebtn" id="roAdd">＋ Añadir</button></div></div>
    <div class="mut">Quitar a alguien de la lista no borra sus partidas del historial.</div>
    <div class="acts"><button class="btn-ghost" id="roC">Cancelar</button><button class="btn-gold" id="roS">Guardar</button></div>`);
  const pending = { removed: new Set() };
  $('#roC').onclick = () => { closeModal(); render(); };
  document.querySelectorAll('[data-pstat]').forEach(b => b.onclick = () => openPlayer(b.dataset.pstat, openRoster));
  document.querySelectorAll('[data-rodel]').forEach(b => b.onclick = () => { pending.removed.add(nkey(b.dataset.rodel)); b.closest('.hrow').style.display = 'none'; });
  const readEdits = () => [...document.querySelectorAll('[data-ro]')].map(el => ({ o: el.dataset.orig, v: el.value.trim() }));
  const applyRoster = (edits) => {
    const merges = [];
    edits.forEach(({ o, v }) => {
      if (pending.removed.has(nkey(o)) || !v || v === o) return;
      const target = S.roster.find(x => nkey(x) === nkey(v) && nkey(x) !== nkey(o));
      if (target) merges.push(o + ' → ' + target);
      renameEverywhere(o, target || v);
      S.roster = S.roster.filter(x => nkey(x) !== nkey(o));
      if (!target) S.roster.push(v);
    });
    S.roster = S.roster.filter(x => !pending.removed.has(nkey(x)));
    return merges;
  };
  $('#roAdd').onclick = () => {
    const v = $('#roNew').value.trim(); if (!v) return;

}

function cmpVer(a, b) { const x = a.split('.').map(Number), y = b.split('.').map(Number); for (let i = 0; i < 3; i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; }
async function checkUpdates(manual) {
  if (manual) openModal('<h3>🔄 Buscando actualizaciones…</h3><div class="sub">Un momento.</div>');
  try {
    const r = await fetch('https://api.github.com/repos/' + REPO + '/releases/latest', { cache: 'no-store', headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const v = String(j.tag_name || '').replace(/^v/, '');
    const apk = (j.assets || []).find(a => /\.apk$/i.test(a.name));

    if (!/^\d+\.\d+\.\d+$/.test(v) || !apk) { if (manual) showUpdMsg('No hay ninguna versión publicada todavía.'); return; }
    if (cmpVer(v, APP_VERSION) > 0) {
      S.updAvail = { v, url: apk.browser_download_url, page: j.html_url, note: (j.body || '').split('\n')[0] }; save(); refreshUpdBadge();

    } else {

  }
}
function hasUpd() { return !isPlay() && isNative() && !!(S.updAvail && cmpVer(S.updAvail.v, APP_VERSION) > 0); }
function openUpdAvail() { if (hasUpd()) showUpdate(S.updAvail.v, S.updAvail.url, S.updAvail.page, S.updAvail.note); }

async function installUpdate(url, page) {

/* ---------- Compartir resultados como imagen ---------- */
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || '#000'; }
function drawShareImage({ title, subtitle, cols, rows, note }) {
  const W = 1080, P = 56, rowH = 92, headH = 70;
  const H = P + 70 + 50 + 40 + headH + rows.length * rowH + 40 + (note ? 50 : 0) + 60 + P;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const bg = cssVar('--bg'), card = cssVar('--card'), card2 = cssVar('--card2'), txt = cssVar('--txt'), mut = cssVar('--mut'), gold = cssVar('--gold'), line = cssVar('--line');
  const font = (w, sz) => `${w} ${sz}px system-ui, -apple-system, Roboto, "Segoe UI", sans-serif`;
  const rr = (x, y, w, h, r, fill) => { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); g.fillStyle = fill; g.fill(); };
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  let y = P;
  g.fillStyle = gold; g.font = font(800, 30); g.fillText('🃏  PUMBA', P, y + 30);
  g.fillStyle = txt; g.font = font(800, 54); g.fillText(title, P, y + 100);
  g.fillStyle = mut; g.font = font(500, 32); g.fillText(subtitle, P, y + 150);
  y += 190;
  const tableH = headH + rows.length * rowH;
  rr(P, y, W - 2 * P, tableH, 28, card);
  // columnas: posición, nombre y el resto alineadas a la derecha
  const xs = [P + 30, P + 120]; const rightCols = cols.slice(2); const colW = 150;
  rightCols.forEach((_, i) => xs.push(W - P - 30 - (rightCols.length - 1 - i) * colW));
  g.fillStyle = card2; g.save(); g.beginPath(); g.rect(P, y, W - 2 * P, headH); g.clip(); rr(P, y, W - 2 * P, tableH, 28, card2); g.restore();
  g.font = font(700, 28); g.fillStyle = mut;
  cols.forEach((h, i) => { g.textAlign = i < 2 ? 'left' : 'right'; g.fillText(h, xs[i], y + 46); });
  rows.forEach((r, ri) => {
    const ty = y + headH + ri * rowH;
    if (ri) { g.fillStyle = line; g.fillRect(P + 20, ty, W - 2 * P - 40, 2); }
    r.forEach((v, i) => {
      g.textAlign = i < 2 ? 'left' : 'right';
      g.fillStyle = i === 2 ? gold : txt;
      g.font = font(i === 1 || i === 2 ? 800 : 500, i === 0 ? 40 : 38);
      let t = String(v); if (i === 1) { while (g.measureText(t).width > xs[2] - xs[1] - colW + 20 && t.length > 3) t = t.slice(0, -2) + '…'; }
      g.fillText(t, xs[i], ty + 60);
    });
  });
  g.textAlign = 'left'; y += tableH + 50;
  if (note) { g.fillStyle = mut; g.font = font(500, 28); g.fillText(note, P, y); y += 50; }
  g.fillStyle = mut; g.font = font(500, 26); g.fillText('Pumba — © 2026 IT Canarias', P, y + 20);
  return c.toDataURL('image/png');
}
async function shareImage(dataUrl, fileName, text) {
  try {
    if (isNative()) {
      const { Filesystem, Share } = window.Capacitor.Plugins;
      const r = await Filesystem.writeFile({ path: fileName, data: dataUrl.split(',')[1], directory: 'CACHE' });
      await Share.share({ title: 'Pumba', text, files: [r.uri], dialogTitle: 'Compartir resultado' });
      return;
    }
    const blob = await (await fetch(dataUrl)).blob();
    const file = new File([blob], fileName, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], text }); return; }
    const a = document.createElement('a'); a.href = dataUrl; a.download = fileName; document.body.appendChild(a); a.click(); a.remove();
    toast('Imagen descargada');
  } catch (e) {
    if (!/cancel|abort/i.test(String(e && (e.message || e.name)))) toast('No se pudo compartir');
  }
}

/* ---------- Copia de seguridad ---------- */
const isNative = () => !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
function backupJSON() {
  return JSON.stringify({ app: 'pumba-marcador', format: 1, version: APP_VERSION, exported: new Date().toISOString(), archive: S.archive, game: S.game, roster: S.roster, theme: S.theme, fontScale: S.fontScale, lastNames: S.lastNames, lastCfg: S.lastCfg });
}
const SAFE_ID = /^[A-Za-z0-9_-]{1,40}$/;
const num = (v, d) => { const n = Number(v); return Number.isFinite(n) ? Math.round(n) : d; };
const cleanName = n => String(n == null ? '' : n).replace(/[<>"'`\u0000-\u001f]/g, '').trim().slice(0, 24);
function cleanCfg(c) {
  c = c || {};
  return { limit: Math.max(1, num(c.limit, 100)),
    rebuyMode: ['max', 'fixed', 'none'].includes(c.rebuyMode) ? c.rebuyMode : 'max', rebuyFixed: num(c.rebuyFixed, 0), maxRebuys: Math.max(0, num(c.maxRebuys, 1)),
    stake: Math.max(0, Number(c.stake) || 0), rebuyStake: Math.max(0, Number(c.rebuyStake) || 0) };
}
// Devuelve una partida con solo datos válidos (ids seguros, números de verdad, textos limpios) o null
function cleanGame(g, archived) {
  if (!g || typeof g !== 'object' || !Array.isArray(g.players) || !Array.isArray(g.events)) return null;
  const map = {}, players = [];
  for (const p of g.players.slice(0, MAX_PLAYERS)) {
    if (!p) continue;
    const id = SAFE_ID.test(String(p.id)) && !map[p.id] ? String(p.id) : uid();
    map[p.id] = id; players.push({ id, name: cleanName(p.name) || 'Jugador ' + (players.length + 1) });
  }
  if (players.length < 2) return null;
  const ok = id => players.some(p => p.id === id);
  const events = [];
  for (const e of g.events.slice(0, 2000)) {
    if (!e) continue;
    if (e.t === 'hand') {
      const scores = {};
      for (const k in (e.scores || {})) if (map[k] && ok(map[k])) scores[map[k]] = num(e.scores[k], 0);
      events.push({ t: 'hand', dealer: map[e.dealer] || players[0].id, closer: map[e.closer] || null, kind: 'normal', scores, at: num(e.at, 0) });
    } else if (e.t === 'rebuy' && map[e.p]) events.push({ t: 'rebuy', p: map[e.p], score: num(e.score, 0), at: num(e.at, 0) });
  }
  const out = { id: SAFE_ID.test(String(g.id)) ? String(g.id) : uid(), created: num(g.created, Date.now()), cfg: cleanCfg(g.cfg), players, firstDealer: map[g.firstDealer] || players[0].id, events };
  if (archived) {
    const R = compute(out);
    Object.assign(out, { finished: num(g.finished, out.created), hands: R.hand, winnerName: R.ended ? pname(out, R.ended.winner) : '(sin terminar)' });
  }

}
function validBackup(b) { return b && b.app === 'pumba-marcador' && Array.isArray(b.archive); }
// Añade lo que trae la copia sin duplicar ni borrar nada de lo que ya hay
function mergeBackup(b) {
  const have = new Set(S.archive.map(a => a.id));
  const nuevas = b.archive.slice(0, MAX_ARCHIVE).map(a => cleanGame(a, true)).filter(a => a && !have.has(a.id));
  S.archive = S.archive.concat(nuevas).sort((x, y) => (y.finished || y.created || 0) - (x.finished || x.created || 0)).slice(0, MAX_ARCHIVE);
  const g = !S.game && cleanGame(b.game, false); if (g) S.game = g;
  (Array.isArray(b.roster) ? b.roster : []).map(cleanName).forEach(n => { if (n && !S.roster.some(x => nkey(x) === nkey(n))) S.roster.push(n); });
  S.archive.forEach(a => a.players.forEach(p => { if (!/^Jugador \d+$/.test(p.name) && !/^🤖/.test(p.name) && !S.roster.some(x => nkey(x) === nkey(p.name))) S.roster.push(p.name); }));
  if (!S.theme && THEMES[b.theme]) { S.theme = b.theme; applyTheme(S.theme); }
  if (!S.fontScale && FONT_SIZES.some(f => f[0] === String(b.fontScale))) { S.fontScale = String(b.fontScale); applyFont(); }
  return nuevas.length;
}

/* Copia automática (solo app Android):
   - en la memoria interna de la app: Android la incluye en su copia de seguridad de Google y la devuelve al reinstalar o cambiar de móvil;
   - en Documentos/Pumba del móvil, si Android lo permite. */
const AUTO_FILE = 'pumba-copia-auto.json';
let autoBackupBusy = false;
async function autoBackup(force) {
  if (!isNative() || autoBackupBusy) return;
  if (!S.archive.length && !S.game) return;
  if (!force && S.lastAutoBackup && Date.now() - S.lastAutoBackup < 3600e3) return;
  autoBackupBusy = true;
  try {
    const { Filesystem } = window.Capacitor.Plugins, data = backupJSON();
    await Filesystem.writeFile({ path: AUTO_FILE, data, directory: 'DATA', encoding: 'utf8' });
    try { await Filesystem.writeFile({ path: 'Pumba/' + AUTO_FILE, data, directory: 'DOCUMENTS', encoding: 'utf8', recursive: true }); S.autoBackupDocs = true; }
    catch (e) { S.autoBackupDocs = false; }
    S.lastAutoBackup = Date.now(); save();
  } catch (e) { /* sin copia esta vez; se reintenta más tarde */ }
  autoBackupBusy = false;
}
// Tras reinstalar: si la app está vacía y hay una copia, ofrecer recuperarla
async function offerRestore() {
  if (!isNative() || S.archive.length || S.game || S.restoreOffered) return;
  const { Filesystem } = window.Capacitor.Plugins;
  let b = null;
  for (const [path, directory] of [[AUTO_FILE, 'DATA'], ['Pumba/' + AUTO_FILE, 'DOCUMENTS']]) {
    try { const r = await Filesystem.readFile({ path, directory, encoding: 'utf8' }); const j = JSON.parse(r.data); if (validBackup(j) && (j.archive.length || j.game)) { b = j; break; } } catch (e) {}
  }
  S.restoreOffered = true; save();
  if (!b) return;
  const when = new Date(b.exported).toLocaleString('es-ES', { day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
  confirmBox('Recuperar tus partidas', `Hay una copia de seguridad del ${when} con ${b.archive.length} partida${b.archive.length === 1 ? '' : 's'}${b.game ? ' y una partida en curso' : ''}. ¿Quieres recuperarla?`, 'Recuperar', () => {
    const n = mergeBackup(b); save(); render(); toast(n + ' partidas recuperadas');
  });
}

/* ---------- Clasificación, jornadas y partidas ---------- */
const JORNADA_HOUR = 6;      // la jornada empieza a las 6:00 (una noche larga cuenta como un solo día)
const RANK_C = 10;           // partidas "virtuales" con las que se ajusta la valoración
const RANK_MIN = 5;          // con menos partidas, la valoración se marca como provisional
const pad2 = n => String(n).padStart(2, '0');
const nkey = n => String(n || '').trim().toLowerCase();
function jornadaKey(ts) { const d = new Date(ts - JORNADA_HOUR * 3600e3); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function jornadaLabel(k) { const [y, m, d] = k.split('-').map(Number); const s = new Date(y, m - 1, d).toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); return s.charAt(0).toUpperCase() + s.slice(1); }

// Resultado de una partida terminada: puesto y puntos de cada jugador
function gameResult(a) {
  const R = compute(a); if (!R.ended) return null;
  const P = a.players, w = R.ended.winner;
  const surv = id => { const s = R.st[id]; return s.out ? s.outHand : 1e9; };
  const others = P.filter(p => p.id !== w).sort((x, y) => (surv(y.id) - surv(x.id)) || (R.st[x.id].total - R.st[y.id].total));
  const order = [P.find(p => p.id === w), ...others], N = order.length;
  const closes = {};
  a.events.forEach(e => { if (e.t === 'hand' && e.closer) closes[e.closer] = (closes[e.closer] || 0) + 1; });
  return {
    ts: a.finished || a.created, N, hands: R.hand,
    rows: order.map((p, i) => ({ key: nkey(p.name), name: p.name.trim(), pos: i + 1, win: i === 0,
      pts: N > 1 ? Math.round(100 * (N - 1 - i) / (N - 1)) / 10 : 10,
      rebuys: R.st[p.id].rebuys, closes: closes[p.id] || 0, total: R.st[p.id].total }))
  };
}
function aggregate(results) {
  const m = {};
  results.forEach(g => g.rows.forEach(r => {
    const o = m[r.key] || (m[r.key] = { name: r.name, pj: 0, g: 0, pts: 0, pos: 0, podios: 0, closes: 0, rebuys: 0 });
    o.name = r.name; o.pj++; o.g += r.win ? 1 : 0; o.pts += r.pts; o.pos += r.pos; o.podios += r.pos <= Math.min(3, g.N - 1 || 1) ? 1 : 0;
    o.closes += r.closes; o.rebuys += r.rebuys;
  }));
  const list = Object.values(m);
  const totPj = list.reduce((a, o) => a + o.pj, 0), mean = totPj ? list.reduce((a, o) => a + o.pts, 0) / totPj : 5;
  list.forEach(o => { o.avg = o.pts / o.pj; o.rating = (o.pts + RANK_C * mean) / (o.pj + RANK_C); o.avgPos = o.pos / o.pj; });
  return list;
}
const fmt1 = v => (Math.round(v * 10) / 10).toLocaleString('es-ES');
const medal = i => ['🥇', '🥈', '🥉'][i] || (i + 1) + '.';

/* ---------- Ficha de jugador ---------- */
function playerStats(key) {
  const all = S.archive.map(a => ({ a, r: gameResult(a) })).filter(x => x.r);
  const games = [];
  all.forEach(({ a, r }) => {
    const me = r.rows.find(x => x.key === key); if (!me) return;
    const pl = a.players.find(p => nkey(p.name) === key); const R = compute(a);
    let hp = 0, hn = 0;
    R.rows.forEach(row => {
      if (row.type !== 'hand') return;
      if (pl.id in row.applied) { hn++; hp += Math.max(0, row.applied[pl.id]); }
    });
    games.push({ ts: r.ts, pos: me.pos, win: me.win, rebuys: me.rebuys, closes: me.closes, hp, hn, rivals: r.rows.filter(x => x.key !== key) });
  });
  if (!games.length) return null;
  games.sort((x, y) => x.ts - y.ts);
  let best = 0, cur = 0; games.forEach(g => { cur = g.win ? cur + 1 : 0; best = Math.max(best, cur); });
  const rank = aggregate(all.map(x => x.r)).sort((a, b) => (b.rating - a.rating) || (b.g - a.g) || (b.pj - a.pj));
  const ri = rank.findIndex(o => nkey(o.name) === key);
  const h2h = {};
  games.forEach(g => g.rivals.forEach(o => { const h = h2h[o.key] || (h2h[o.key] = { name: o.name, ahead: 0, behind: 0 }); h.name = o.name; if (g.pos < o.pos) h.ahead++; else h.behind++; }));
  const monthKey = ts => { const d = new Date(ts - JORNADA_HOUR * 3600e3); return d.getFullYear() + '-' + pad2(d.getMonth() + 1); };
  const byMonth = {}; all.forEach(x => (byMonth[monthKey(x.r.ts)] = byMonth[monthKey(x.r.ts)] || []).push(x.r));
  const months = [...new Set(games.map(g => monthKey(g.ts)))].sort().slice(-6).map(m => {
    const o = aggregate(byMonth[m]).find(z => nkey(z.name) === key);
    const [y, mm] = m.split('-').map(Number);
    return { label: new Date(y, mm - 1, 1).toLocaleDateString('es-ES', { month: 'short' }).replace('.', ''), v: o ? o.rating * 10 : 0 };
  });
  const sum = f => games.reduce((a, g) => a + f(g), 0);
  return {
    name: rank[ri] ? rank[ri].name : key, rankPos: ri + 1, rating: rank[ri] ? rank[ri].rating * 10 : 0,
    pj: games.length, g: sum(g => g.win ? 1 : 0), avgPos: sum(g => g.pos) / games.length,
    perHand: sum(g => g.hn) ? sum(g => g.hp) / sum(g => g.hn) : 0, best, cur,
    closes: sum(g => g.closes), rebuys: sum(g => g.rebuys),
    winAfterRebuy: sum(g => g.win && g.rebuys ? 1 : 0), since: games[0].ts,
    h2h: Object.values(h2h).sort((a, b) => (b.ahead + b.behind) - (a.ahead + a.behind)).slice(0, 8), months
  };
}

    rows: [['🃏', 'Partidas', st.pj], ['🏆', 'Victorias', st.g + ' (' + Math.round(st.g / st.pj * 100) + '%)'], ['📊', 'Puesto medio', fmt1(st.avgPos) + 'º'], ['🎯', 'Media por mano', fmt1(st.perHand) + ' pts'],
      ['🔥', 'Mejor racha', st.best], ['✓', 'Manos cerradas', st.closes], ['↻', 'Reenganches', st.rebuys]],
    note: st.h2h.length ? 'Cara a cara: ' + st.h2h.slice(0, 3).map(h => h.name + ' ' + h.ahead + '–' + h.behind).join(' · ') : ''
  }), 'pumba-' + nkey(st.name).replace(/[^a-z0-9]+/g, '-') + '.png', 'Mis estadísticas de Pumba 🃏');
}

/* ---------- Récords ---------- */
function computeRecords() {
  const games = S.archive.map(a => ({ a, r: gameResult(a), R: compute(a) })).filter(x => x.r).sort((x, y) => x.r.ts - y.r.ts);
  if (!games.length) return [];
  const fd = ts => new Date(ts).toLocaleDateString('es-ES', { day: 'numeric', month: 'short', year: 'numeric' }).replace('.', '');
  const recs = [];
  const top = (obj) => { let best = null; for (const k in obj) if (!best || obj[k].v > best.v) best = obj[k]; return best; };
  // rachas de victorias
  const streak = {}, cur = {};
  games.forEach(({ r }) => r.rows.forEach(x => { cur[x.key] = x.win ? (cur[x.key] || 0) + 1 : 0; if (!streak[x.key] || cur[x.key] > streak[x.key].v) streak[x.key] = { who: x.name, v: cur[x.key] }; }));
  const st = top(streak); if (st && st.v > 1) recs.push({ ic: '🔥', t: 'Mejor racha de victorias', who: st.who, val: st.v + ' seguidas' });
  // partida más larga y más corta
  const byHands = games.slice().sort((x, y) => y.r.hands - x.r.hands);
  const L = byHands[0], C = byHands[byHands.length - 1];
  recs.push({ ic: '⏳', t: 'Partida más larga', who: 'Ganó ' + L.r.rows[0].name, val: L.r.hands + ' manos', sub: fd(L.r.ts) });
  if (games.length > 1) recs.push({ ic: '⚡', t: 'Partida más corta', who: 'Ganó ' + C.r.rows[0].name, val: C.r.hands + ' manos', sub: fd(C.r.ts) });
  // totales por jugador
  const tot = (f) => { const m = {}; games.forEach(({ r }) => r.rows.forEach(x => { const v = f(x); if (!v) return; const o = m[x.key] || (m[x.key] = { who: x.name, v: 0 }); o.v += v; o.who = x.name; })); return top(m); };
  const cl = tot(x => x.closes); if (cl) recs.push({ ic: '✓', t: 'Más manos cerradas', who: cl.who, val: cl.v });
  const pj = tot(() => 1); if (pj) recs.push({ ic: '🃏', t: 'Más partidas jugadas', who: pj.who, val: pj.v });
  const war = tot(x => x.win && x.rebuys ? 1 : 0); if (war) recs.push({ ic: '🦅', t: 'Más victorias tras reengancharse', who: war.who, val: war.v });
  // por partida / por mano
  let reb = null, hand = null;
  games.forEach(({ a, r, R }) => {
    r.rows.forEach(x => { if (x.rebuys && (!reb || x.rebuys > reb.v)) reb = { who: x.name, v: x.rebuys, ts: r.ts }; });
    R.rows.forEach(row => { if (row.type !== 'hand') return;
      for (const id in row.applied) { const v = row.applied[id]; if (!hand || v > hand.v) hand = { who: pname(a, id), v, ts: r.ts }; } });
  });
  if (reb && reb.v > 1) recs.push({ ic: '↻', t: 'Más reenganches en una partida', who: reb.who, val: reb.v, sub: fd(reb.ts) });
  if (hand && hand.v > 0) recs.push({ ic: '💥', t: 'Mano más cara', who: hand.who, val: hand.v + ' pts', sub: fd(hand.ts) });
  // jornadas
  const byDay = {}; games.forEach(({ r }) => (byDay[jornadaKey(r.ts)] = byDay[jornadaKey(r.ts)] || []).push(r));
  let bigDay = null, dayWins = null;
  for (const k in byDay) {
    const list = byDay[k]; if (!bigDay || list.length > bigDay.v) bigDay = { v: list.length, k };
    const w = {}; list.forEach(r => { const x = r.rows[0]; const o = w[x.key] || (w[x.key] = { who: x.name, v: 0 }); o.v++; });
    const t = top(w); if (t && (!dayWins || t.v > dayWins.v)) dayWins = { ...t, k };
  }
  if (dayWins && dayWins.v > 1) recs.push({ ic: '👑', t: 'Más victorias en una jornada', who: dayWins.who, val: dayWins.v, sub: jornadaLabel(dayWins.k).replace(/^[^,]+, /, '') });
  if (bigDay && bigDay.v > 1) recs.push({ ic: '📅', t: 'Jornada con más partidas', who: jornadaLabel(bigDay.k).replace(/^[^,]+, /, ''), val: bigDay.v + ' partidas' });
  return recs;
}

let AV = { tab: 'ranking', period: 'all', open: null };
function openArchive(tab) {
  if (typeof tab === 'string') AV.tab = tab;
  const done = S.archive.map(a => ({ a, r: gameResult(a) })).filter(x => x.r);
  const now = new Date();
  const inPeriod = ts => { const d = new Date(ts - JORNADA_HOUR * 3600e3); return AV.period === 'all' || (AV.period === 'year' && d.getFullYear() === now.getFullYear()) || (AV.period === 'month' && d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth()); };
  const tabs = `<div class="kinds" style="margin:0 0 12px">${[['ranking', '🏆 Ranking'], ['jornadas', '📅 Jornadas'], ['records', '🏅 Récords'], ['partidas', '📜 Partidas']].map(([k, l]) => `<button data-tab="${k}" class="${AV.tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  let body = '';

  if (!S.archive.length) {
    body = `<div class="empty">Aún no hay partidas guardadas.<br>Se guardan al pulsar «Revancha», «Nueva partida» o «Terminar partida».</div>`;
  } else if (AV.tab === 'ranking') {
    const list = aggregate(done.filter(x => inPeriod(x.r.ts)).map(x => x.r)).sort((a, b) => (b.rating - a.rating) || (b.g - a.g) || (b.pj - a.pj));
    const pl = { all: 'Desde siempre', year: 'Año ' + now.getFullYear(), month: now.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }) }[AV.period];
    SH.rank = { file: 'pumba-ranking.png', text: 'Ranking de Pumba 🏆', img: { title: 'Ranking de jugadores', subtitle: pl.charAt(0).toUpperCase() + pl.slice(1) + ' · ' + list.reduce((a, o) => a + o.g, 0) + ' partidas',
      cols: ['#', 'Jugador', 'Valor.', 'PJ', 'G', '% G'], rows: list.slice(0, 12).map((o, i) => [medal(i), o.name, Math.round(o.rating * 10), o.pj, o.g, Math.round(o.g / o.pj * 100) + '%']),

    body = `<div class="kinds" style="margin:0 0 10px">${[['all', 'Siempre'], ['year', 'Este año'], ['month', 'Este mes']].map(([k, l]) => `<button data-period="${k}" class="${AV.period === k ? 'on' : ''}">${l}</button>`).join('')}</div>` +
