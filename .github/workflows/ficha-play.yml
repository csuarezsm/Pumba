name: Ficha de Google Play
# Sube a Google Play los textos, el icono, el gráfico destacado, las capturas y el enlace del vídeo de play-store/.
# Se lanza sola al cambiar esa carpeta, o a mano desde Actions → Ficha de Google Play → Run workflow.
on:
  push:
    branches: [main]
    paths: ['play-store/FICHA-GOOGLE-PLAY.md', 'play-store/*.png', 'play-store/video-url.txt']
  workflow_dispatch:
jobs:
  ficha:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - name: Subir la ficha
        env:
          PLAY_JSON: "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}"
          PLAY_IDIOMA: "${{ vars.PLAY_IDIOMA || 'es-ES' }}"
        run: |
          if [ -z "$PLAY_JSON" ]; then echo "::warning::Falta el secreto PLAY_SERVICE_ACCOUNT_JSON: no se sube nada."; exit 0; fi
          node tools/metadatos-play.mjs "$RUNNER_TEMP/play-metadata"
          node tools/subir-ficha-play.mjs com.itcanarias.pumba "$RUNNER_TEMP/play-metadata" "$PLAY_IDIOMA"
